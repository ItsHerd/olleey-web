<!DOCTYPE html>
<html>
<head>
    <title>Olleey Verification</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #080808;
            color: #fff;
        }
        .check { color: #4CAF50; }
        .error { color: #f44336; }
        .warning { color: #FBC02D; }
        .section {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        button {
            background: #FBC02D;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        #output {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>🔍 Olleey Setup Verification</h1>
    
    <div class="section">
        <h2>Step 1: Check userId</h2>
        <div id="userId"></div>
        <button onclick="setUserId()">Set userId to test_user_001</button>
    </div>

    <div class="section">
        <h2>Step 2: Check Supabase Connection</h2>
        <button onclick="checkSupabase()">Test Supabase</button>
        <div id="supabaseResult"></div>
    </div>

    <div class="section">
        <h2>Step 3: Check Data</h2>
        <button onclick="checkVideos()">Check Videos</button>
        <button onclick="checkChannels()">Check Channels</button>
        <button onclick="checkJobs()">Check Jobs</button>
        <div id="dataResult"></div>
    </div>

    <div class="section">
        <h2>Debug Output</h2>
        <div id="output"></div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        const SUPABASE_URL = 'https://wfjpbrcktxbwasbamchx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndmanBicmNrdHhid2FzYmFtY2h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NDA0OTgsImV4cCI6MjA4NjAxNjQ5OH0.9NY10smFlvcjABQ_V1t1SmacxWpnLaNr96LOtQV5TjI';
        
        window.supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        function log(msg) {
            const output = document.getElementById('output');
            output.innerHTML += msg + '<br>';
            output.scrollTop = output.scrollHeight;
        }

        // Check userId
        const userId = localStorage.getItem('userId');
        const userIdDiv = document.getElementById('userId');
        if (userId) {
            userIdDiv.innerHTML = '<span class="check">✅ userId is set: ' + userId + '</span>';
        } else {
            userIdDiv.innerHTML = '<span class="error">❌ userId is NOT set</span>';
        }

        window.setUserId = function() {
            localStorage.setItem('userId', 'test_user_001');
            log('✅ Set userId to test_user_001');
            location.reload();
        };

        window.checkSupabase = async function() {
            log('🔍 Testing Supabase connection...');
            const result = document.getElementById('supabaseResult');
            
            try {
                const { data, error } = await window.supabase
                    .from('videos')
                    .select('count')
                    .limit(1);
                
                if (error) {
                    result.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
                    log('❌ Supabase error: ' + error.message);
                } else {
                    result.innerHTML = '<span class="check">✅ Supabase connection OK</span>';
                    log('✅ Supabase connected successfully');
                }
            } catch (e) {
                result.innerHTML = '<span class="error">❌ Connection failed: ' + e.message + '</span>';
                log('❌ Connection error: ' + e.message);
            }
        };

        window.checkVideos = async function() {
            log('🎥 Checking videos...');
            const userId = localStorage.getItem('userId') || 'test_user_001';
            const result = document.getElementById('dataResult');
            
            try {
                const { data, error, count } = await window.supabase
                    .from('videos')
                    .select('*', { count: 'exact' })
                    .eq('user_id', userId);
                
                if (error) {
                    result.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
                    log('❌ Videos error: ' + error.message);
                } else {
                    result.innerHTML = '<span class="check">✅ Found ' + (count || 0) + ' videos</span>';
                    log('✅ Videos: ' + (count || 0));
                    if (data && data.length > 0) {
                        log('   First video: ' + data[0].title);
                    } else {
                        log('   ⚠️  No videos found - run SUPABASE_SEED_DATA.sql');
                    }
                }
            } catch (e) {
                result.innerHTML = '<span class="error">❌ Error: ' + e.message + '</span>';
                log('❌ Error: ' + e.message);
            }
        };

        window.checkChannels = async function() {
            log('📡 Checking channels...');
            const userId = localStorage.getItem('userId') || 'test_user_001';
            const result = document.getElementById('dataResult');
            
            try {
                const { data, error, count } = await window.supabase
                    .from('channels')
                    .select('*', { count: 'exact' })
                    .eq('user_id', userId);
                
                if (error) {
                    result.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
                    log('❌ Channels error: ' + error.message);
                } else {
                    result.innerHTML = '<span class="check">✅ Found ' + (count || 0) + ' channels</span>';
                    log('✅ Channels: ' + (count || 0));
                    if (data && data.length > 0) {
                        log('   First channel: ' + data[0].channel_name);
                    } else {
                        log('   ⚠️  No channels found - run SUPABASE_SEED_DATA.sql');
                    }
                }
            } catch (e) {
                result.innerHTML = '<span class="error">❌ Error: ' + e.message + '</span>';
                log('❌ Error: ' + e.message);
            }
        };

        window.checkJobs = async function() {
            log('⚙️ Checking jobs...');
            const userId = localStorage.getItem('userId') || 'test_user_001';
            const result = document.getElementById('dataResult');
            
            try {
                const { data, error, count } = await window.supabase
                    .from('processing_jobs')
                    .select('*', { count: 'exact' })
                    .eq('user_id', userId);
                
                if (error) {
                    result.innerHTML = '<span class="error">❌ Error: ' + error.message + '</span>';
                    log('❌ Jobs error: ' + error.message);
                } else {
                    result.innerHTML = '<span class="check">✅ Found ' + (count || 0) + ' jobs</span>';
                    log('✅ Jobs: ' + (count || 0));
                    if (data && data.length > 0) {
                        log('   First job status: ' + data[0].status);
                    } else {
                        log('   ⚠️  No jobs found - run SUPABASE_SEED_DATA.sql');
                    }
                }
            } catch (e) {
                result.innerHTML = '<span class="error">❌ Error: ' + e.message + '</span>';
                log('❌ Error: ' + e.message);
            }
        };

        // Auto-check on load
        log('=== OLLEEY VERIFICATION ===');
        log('userId: ' + (userId || 'NOT SET'));
        log('');
    </script>
</body>
</html>
